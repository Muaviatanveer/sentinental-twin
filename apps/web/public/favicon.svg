  <circle cx="32" cy="20" r="3" fill="url(#nodeGrad)"/>
  <circle cx="22" cy="32" r="2.5" fill="url(#nodeGrad)"/>
  <circle cx="42" cy="32" r="2.5" fill="url(#nodeGrad)"/>
  <circle cx="27" cy="44" r="2.5" fill="url(#nodeGrad)"/>
  <circle cx="37" cy="44" r="2.5" fill="url(#nodeGrad)"/>
  <!-- Network edges -->
  <line x1="32" y1="20" x2="22" y2="32" stroke="#3B82F6" stroke-width="1" opacity="0.7"/>
  <line x1="32" y1="20" x2="42" y2="32" stroke="#3B82F6" stroke-width="1" opacity="0.7"/>
  <line x1="22" y1="32" x2="42" y2="32" stroke="#06B6D4" stroke-width="1" opacity="0.5"/>
  <line x1="22" y1="32" x2="27" y2="44" stroke="#3B82F6" stroke-width="1" opacity="0.7"/>
  <line x1="42" y1="32" x2="37" y2="44" stroke="#3B82F6" stroke-width="1" opacity="0.7"/>
  <line x1="27" y1="44" x2="37" y2="44" stroke="#06B6D4" stroke-width="1" opacity="0.5"/>
