name: real-commerce-app

services:
  frontend:
    build: ./frontend
    image: sentinel-commerce-frontend:latest
    ports:
      - "3001:3000"
    environment:
      - API_URL=http://api:8080
      - DB_HOST=database
      - DB_NAME=commerce
      - DB_USER=admin
      - DB_PASS=password
    networks:
      - shared_net
    depends_on:
      - api

  api:
    build: ./api
    image: sentinel-commerce-api:latest
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=database
      - DB_NAME=commerce
      - DB_USER=admin
      - DB_PASS=password
    networks:
      - shared_net
    depends_on:
      - database

  database:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=commerce
    ports:
      - "5432:5432" # SECURITY FLAW: Exposed to host machine!
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shared_net

networks:
  shared_net:
    driver: bridge
